<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Bebii 💜</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="locked"></body>
  <!-- Entry screen -->
  <div id="lock-screen">
    <div class="lock-box">
      <div class="lock-icon">🔒</div>
      <h2>This is just for you, <span id="lock-name">Bebii</span> 💜</h2>
      <p id="lock-hint"></p>
      <input id="lock-input" type="text" inputmode="numeric" maxlength="8"
             placeholder="• • • •" autocomplete="off">
      <button id="lock-btn">Unlock 💜</button>
      <p id="lock-error"></p>
    </div>
  </div>
  <canvas id="hearts-bg"></canvas>

  <header class="hero" id="home">
    <h1>Happy 5 Months, <span id="nickname">Bebii</span> 💜</h1>
<p class="subtitle">Every day with you is my favorite day</p>

<div class="countdown-wrap">
  <div class="count-card">
    <p class="count-label">Together for</p>
    <div class="count-big" id="days-together">0</div>
    <p class="count-label">days</p>
    <p class="count-small" id="time-together"></p>
    <p class="count-small" id="months-together"></p>
  </div>

  <div class="count-card">
    <p class="count-label" id="next-label">Next monthsary in</p>
    <div class="count-boxes">
      <div><span id="cd-days">0</span><small>days</small></div>
      <div><span id="cd-hours">0</span><small>hours</small></div>
      <div><span id="cd-mins">0</span><small>mins</small></div>
      <div><span id="cd-secs">0</span><small>secs</small></div>
    </div>
  </div>
</div>

  </header>

  <section id="timeline"></section>
  <section id="gallery"></section>
  <section id="reasons"></section>
  <section id="songs"></section>
  <section id="letter"></section>

  <button id="music-btn" aria-label="Play or pause music">🎵</button>
  <audio id="bg-music" loop preload="none">
    <source src="audio/our-song.mp3" type="audio/mpeg">
  </audio>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/hearts.js"></script>
</body>
</html>
